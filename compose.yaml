services:
  recognition:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env.recognition
    volumes:
      - recognition-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/health'))['recognition_ready']"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  recognition-data:
